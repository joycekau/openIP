  <circle cx="120" cy="103" r="13.5" fill="#F7E3A6"/>
  <!-- fins -->
  <path d="M90 130 L67 172 L90 159 Z" fill="#141013"/>
  <path d="M150 130 L173 172 L150 159 Z" fill="#141013"/>
  <!-- exhaust / launch flame -->
  <path d="M107 168 L120 205 L133 168 Z" fill="#141013" fill-opacity="0.92"/>
  <circle cx="120" cy="196" r="6" fill="#141013" fill-opacity="0.6"/>
</svg>
