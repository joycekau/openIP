<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CoraLaunch">
  <defs>
    <linearGradient id="clg" x1="30" y1="24" x2="210" y2="216" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7E3A6"/>
      <stop offset="0.5" stop-color="#E8C15A"/>
      <stop offset="1" stop-color="#B8912E"/>
    </linearGradient>
    <linearGradient id="clShine" x1="60" y1="30" x2="180" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- badge -->
  <rect x="8" y="8" width="224" height="224" rx="54" fill="url(#clg)"/>
  <rect x="8" y="8" width="224" height="224" rx="54" fill="url(#clShine)"/>
  <!-- rocket body -->
  <path d="M120 38 C141 57 150 84 150 115 L150 150 C150 159.4 142.4 167 133 167 L107 167 C97.6 167 90 159.4 90 150 L90 115 C90 84 99 57 120 38 Z" fill="#141013"/>
